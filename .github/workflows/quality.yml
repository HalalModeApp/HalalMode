name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  client:
    name: Client checks and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_USE_MOCKS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify:client
      - run: npm run export:android

  database-contracts:
    name: Isolated database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase services
        run: supabase start

      - name: Reset local database and run pgTAP contracts
        run: supabase db reset --local && supabase test db

      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop
