name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  client:
    name: Client checks and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_USE_MOCKS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify:client
      - run: npm run export:android

# Database contract tests intentionally are not run here yet. They require a
# committed Supabase local configuration plus Docker, neither of which is in a
# release-safe state in this repository. See docs/QUALITY_GATES.md before
# enabling a database job: it must run `supabase db reset --local` followed by
# `supabase test db` against an isolated database, never the linked project.
