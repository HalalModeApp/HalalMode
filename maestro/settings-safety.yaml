appId: com.halalmode.app
---
# Runs in an isolated seeded session; navigation and actions use stable IDs.
- launchApp
- tapOn:
    id: tab-you
- tapOn:
    id: you-tab-settings
- assertVisible:
    id: settings-blocked-members
- tapOn:
    id: settings-blocked-members
- assertVisible:
    id: settings-blocked-title
- pressKey: back
- scrollUntilVisible:
    element:
      id: settings-delete-account
    direction: DOWN
- tapOn:
    id: settings-delete-account
- assertVisible:
    id: settings-delete-dialog
- tapOn:
    id: settings-delete-dialog-cancel
